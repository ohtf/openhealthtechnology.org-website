# Checks every pull request and push: the nav has no orphaned or missing
# pages, and the site builds. Deployment lives in docs.yml and runs on main
# only, so these checks are what block a broken pull request.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: s/check-docs-nav
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - run: zensical build --clean --strict
