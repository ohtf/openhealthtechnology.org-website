<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OHTF">
  <!-- OHTF mark: a health cross built from five separate blocks, for open software built from shared parts. -->
  <rect width="32" height="32" rx="7" fill="#0d4a3b"/>
  <rect x="12.5" y="5" width="7" height="6.5" rx="1.5" fill="#cfdbd8"/>
  <rect x="5" y="12.75" width="6.5" height="6.5" rx="1.5" fill="#cfdbd8"/>
  <rect x="12.5" y="12.75" width="7" height="6.5" rx="1.5" fill="#ffffff"/>
  <rect x="20.5" y="12.75" width="6.5" height="6.5" rx="1.5" fill="#cfdbd8"/>
  <rect x="12.5" y="20.5" width="7" height="6.5" rx="1.5" fill="#cfdbd8"/>
</svg>
